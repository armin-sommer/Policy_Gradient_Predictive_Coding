name: pcpg-mujoco-layerwise-sweep

workdir: .

resources:
  accelerators: H200:4
  disk_size: 100

volumes:
  /checkpoints: checkpoints

envs:
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: pcpg-mujoco-layerwise-sweep
  CONFIG_PATH: configs/mujoco_halfcheetah_pc_actor_critic_parameter_local_tr.yaml

setup: |
  set -euo pipefail
  curl -LsSf https://astral.sh/uv/install.sh | sh
  "$HOME/.local/bin/uv" venv --python 3.12 --seed "$HOME/.pcpg-venv"
  source "$HOME/.pcpg-venv/bin/activate"
  python -m pip install --upgrade pip setuptools wheel
  pip install --ignore-installed blinker -r requirements-gpu.txt
  pip install --force-reinstall --no-deps -r requirements-cuda124.txt

run: |
  set -euo pipefail
  source "$HOME/.pcpg-venv/bin/activate"
  run_root="/checkpoints/${PANTHEON_USER}/${EXPERIMENT_TAG}"
  mkdir -p "$run_root/results"
  if [ -f "$run_root/COMPLETE" ]; then
    echo "already complete: $run_root"
    exit 0
  fi
  PYTHONPATH=src python scripts/run_local_tr_hparam_sweep.py \
    --config "$CONFIG_PATH" \
    --gpus 0 1 2 3 \
    --seeds 1 \
    --total-steps 5000000 \
    --output-dir "$run_root/results" \
    2>&1 | tee -a "$run_root/managed_job.log"
  touch "$run_root/COMPLETE"
