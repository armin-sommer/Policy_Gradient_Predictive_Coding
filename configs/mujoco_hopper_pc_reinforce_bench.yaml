# Gaussian PCPG-MC — Hopper bench tier ([64,64], 256 envs, 1M steps).
# Long rollouts: MC returns are truncated at the rollout boundary (no value
# bootstrap), so unroll must cover the effective horizon (~100 steps at
# gamma=0.99). 256 envs x 256 steps = 65,536 env steps per update.
env:
  env_name: "hopper"
  num_envs: 256
  episode_length: 1000

train:
  total_steps: 1_000_000
  rollout_length: 256
  gamma: 0.99
  learning_rate: 3.0e-4
  target_scale: 1.0
  max_t1: 20
  # max_t1 is an ODE END TIME, and jpc's energy carries a 1/N factor, so the
  # per-sample inference time is t1/N -- 20/2048 ~ 0.01 at this batch size,
  # i.e. ~1% settled. This cancels the 1/N so max_t1 IS the per-sample time;
  # 20 then settles to 99.5%. Raising max_t1 instead cannot work (jpc hard-
  # stops at t=4096, and convergence would need ~20,480). See
  # src/pc_algorithms/inference.py and docs/PCPG_GEOMETRY_FINDINGS.md 4d.
  inference_rate_correction: true
  pc_steps_per_update: 1
  update_epochs: 2
  num_minibatches: 4
  normalize_advantages: true
  normalize_rewards: true
  eval_every: 2
  num_eval_episodes: 10

agent:
  algorithm: "pc_reinforce"
  experiment_name: "pc_reinforce_mujoco_bench"
  width: 64
  depth: 2
  exp_std: true

wandb:
  mode: disabled
  project: "mujoco-pcpg"
  group: null

seed: 1
