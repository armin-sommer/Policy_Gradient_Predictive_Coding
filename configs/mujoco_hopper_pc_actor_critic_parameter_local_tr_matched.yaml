# Direct layerwise TR-PCPG matched to the Hopper TRPO policy and data budget.
env:
  env_name: "hopper"
  num_envs: 1024
  episode_length: 1000

train:
  total_steps: 30_000_000
  rollout_length: 32
  gamma: 0.99
  gae_lambda: 0.97
  value_learning_rate: 1.0e-3
  max_t1: 20
  inference_rate_correction: true
  pc_steps_per_update: 1
  update_epochs: 10
  num_minibatches: 1
  normalize_advantages: true
  normalize_rewards: true
  policy_geometry: "parameter_local_tr"
  # Match TRPO's CG regularization; the update is still applied directly,
  # without line search or rejection.
  parameter_pc_damping: 0.1
  parameter_pc_max_radius: 0.01
  parameter_pc_cg_iters: 1000
  parameter_pc_cg_tol: 1.0e-8
  eval_every: 25
  num_eval_episodes: 10

agent:
  algorithm: "pc_actor_critic"
  experiment_name: "pc_actor_critic_parameter_local_tr_matched"
  width: 256
  depth: 3
  act_fn: "tanh"
  exp_std: true
  state_indep_std: true
  log_std_min: -5.0
  log_std_max: 2.0
  sota_init: true

wandb:
  mode: disabled
  project: "mujoco-pcpg"
  group: null

seed: 1
