# Output-natural-gradient PCPG through additive precision-energy inference.
env:
  env_name: "halfcheetah"
  num_envs: 256
  episode_length: 1000

train:
  total_steps: 1_000_000
  rollout_length: 32
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 3.0e-4
  value_learning_rate: 3.0e-4
  target_scale: 1.0
  max_t1: 20
  inference_rate_correction: true
  pc_steps_per_update: 1
  update_epochs: 2
  num_minibatches: 4
  normalize_advantages: true
  normalize_rewards: true
  policy_geometry: "precision_npg"
  # Scalar precision only changes natural-gradient step length. Beta=24 matches
  # the initial scale selected automatically by the radius-0.01 TR variant.
  precision_beta: 24.0
  eval_every: 10
  num_eval_episodes: 10

agent:
  algorithm: "pc_actor_critic"
  experiment_name: "pc_actor_critic_precision_npg"
  width: 64
  depth: 2
  act_fn: "tanh"
  exp_std: true

wandb:
  mode: disabled
  project: "mujoco-pcpg"
  group: null

seed: 1
